[package]
name = "styx-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
near = ["dep:near-sdk", "dep:borsh"]
persistent-state = ["near"]
sdk-tests = ["near", "near-sdk/unit-testing", "dep:near-parameters"]

[dependencies]
near-sdk = { version = "=5.29.1", optional = true }
borsh = { version = "1", features = ["derive"], optional = true }
near-parameters = { version = "=0.37.4", optional = true }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
